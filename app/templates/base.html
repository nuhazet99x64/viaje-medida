<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agencia de Viaje{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/basic.css') }}">
</head>
<!--Conecta porfa el css-->

<body>
    <header>
        <h1>Agencia de Viaje</h1>
        <nav>
            <ul>
                <li><a href="{{url_for('nosotros')}}">Acerca de nosotros</a></li>
                <li>
                    <a href="{{ url_for('home') }}">Inicio</a>
                </li>
                <li>
                    <a href="{{ url_for('saludo', name='invitado') }}">Saluda</a>
                </li>
                <li>
                    <a href="{{ url_for('catalogo') }}">Catalogo</a>
                </li>
                <li>
                    <a href=" {{ url_for('contacto') }}">Contacto</a>
                </li>
                <li>
                    <a href="{{ url_for('filtrar') }}">Filtrar</a>
                </li>
                <li>
                    <a href="{{ url_for('login') }}">Iniciar Sesión</a>
                </li>
            </ul>
        </nav>
        <hr />
    </header>
    <main>
        {% block content %}
        <h1>Contenido de mi página</h1>
        {% endblock %}
    </main>
    <footer>
        <hr />
        <p>2026&copy;IES Las Galletas</p>
    </footer>
</body>

</html>
